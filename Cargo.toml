[package]
name = "mail"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "mail"
path = "src/lib.rs"

[[bin]]
name = "mail-triage"
path = "src/bin/mail-triage.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
html2text = "0.17"
mail-parser = "0.11"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
