[package]
name = "mail"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "mail"
path = "src/lib.rs"

[[bin]]
name = "mail-triage"
path = "src/bin/mail-triage.rs"

[[bin]]
name = "mail-dump"
path = "src/bin/mail-dump.rs"

[[bin]]
name = "mail-find"
path = "src/bin/mail-find.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
html-to-markdown-rs = "3"
mail-parser = "0.11"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
